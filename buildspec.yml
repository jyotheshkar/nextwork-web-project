version: 0.2

# This sample builds without account-specific AWS credentials.
# Provisioning CodeBuild and deploying remain separate operations.
phases:
  install:
    runtime-versions:
      java: corretto17
  build:
    commands:
      - mvn --batch-mode --no-transfer-progress clean verify
artifacts:
  files:
    - target/nextwork-web-project.war
  discard-paths: no
